<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>RASA Resonance</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    :root{--bg:#070707;--panel:#111;--line:#2b2b2b;--text:#eeeeee;--muted:#858585;--soft:#171717;--glow:rgba(255,255,255,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}
    body{min-height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 12%,#191919 0,#0c0c0c 35%,#050505 100%)}
    body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.06),transparent 28%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.035),transparent 34%);filter:blur(20px);animation:breathe 9s ease-in-out infinite alternate;pointer-events:none}
    @keyframes breathe{from{opacity:.45;transform:scale(1)}to{opacity:.9;transform:scale(1.05)}}
    .wrap{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{width:min(440px,100%);min-height:640px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(20,20,20,.86),rgba(8,8,8,.9));border-radius:30px;padding:36px 26px;box-shadow:0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(16px)}
    .logos{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:4px;margin-bottom:56px}
    .logoBox{position:relative;display:flex;align-items:center;justify-content:center}
    .logoBox:before{content:"";position:absolute;inset:-28px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 64%);filter:blur(18px);opacity:.7}
    .rasa{position:relative;width:210px;max-width:70%;filter:invert(1) brightness(1.35);opacity:.86}
    .wenyi{position:relative;width:260px;max-width:82%;filter:invert(1) brightness(1.25);opacity:.72}
    .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:18px}
    .title{font-size:30px;line-height:1.45;text-align:center;letter-spacing:.08em;font-weight:500;margin:0 0 18px}
    .freq{text-align:center;color:#bdbdbd;font-size:13px;letter-spacing:.18em;margin-bottom:28px;text-transform:uppercase}
    .hint{text-align:center;color:#8a8a8a;font-size:14px;line-height:1.9;margin:0 auto 30px;max-width:300px}
    .btn{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.035);color:#f4f4f4;border-radius:999px;width:100%;padding:16px 18px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;transition:.25s}
    .btn:active{transform:scale(.98);background:#202020}.btn:disabled{opacity:.55}.btn.secondary{text-transform:none;letter-spacing:.08em;margin-top:12px}
    .screen{display:none;animation:fade .5s ease both}.screen.active{display:block}@keyframes fade{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
    textarea,input{width:100%;background:transparent;color:var(--text);border:0;border-bottom:1px solid rgba(255,255,255,.18);border-radius:0;padding:14px 2px;font-size:18px;line-height:1.7;outline:0}
    textarea{min-height:190px;resize:none} input{font-size:15px;margin:18px 0 22px;color:#ccc}.status{text-align:center;color:#999;font-size:13px;min-height:22px;margin-top:14px;line-height:1.7}.fine{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:#575757;letter-spacing:.16em}.toast{position:fixed;left:20px;right:20px;bottom:24px;background:#191919;border:1px solid #333;color:#ddd;padding:14px 16px;border-radius:16px;display:none;z-index:10;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="screen active" id="intro">
        <div class="logos"><div class="logoBox"><img class="rasa" src="./assets/rasa-logo.png" /></div><div class="logoBox"><img class="wenyi" src="./assets/wenyi-logo.png" /></div></div>
        <div class="eyebrow">RASA RESONANCE</div>
        <h1 class="title">今晚，<br>留下一點什麼。</h1>
        <p class="hint">你的文字會被送往現場的共鳴牆，成為今晚緩慢漂浮的一部分。</p>
        <button class="btn" id="enterBtn">ENTER</button>
      </div>
      <div class="screen" id="formScreen">
        <div class="logos" style="margin-bottom:34px"><div class="logoBox"><img class="rasa" style="width:150px" src="./assets/rasa-logo.png" /></div></div>
        <div class="freq" id="freqText">Frequency 01</div>
        <h2 class="title" style="font-size:24px" id="promptText">今晚，你想留下什麼？</h2>
        <textarea id="message" maxlength="120" placeholder="在這裡寫下一句話…"></textarea>
        <input id="nickname" maxlength="18" placeholder="暱稱，可留空匿名" />
        <button class="btn" id="sendBtn">SEND</button><div class="status" id="status"></div>
      </div>
      <div class="screen" id="done">
        <div class="logos"><div class="logoBox"><img class="rasa" src="./assets/rasa-logo.png" /></div></div>
        <div class="eyebrow">SENT</div><h1 class="title">你的共鳴，<br>已加入今晚。</h1><p class="hint">請抬頭看看現場的藝術牆。</p><button class="btn secondary" onclick="location.reload()">再留下一則</button>
      </div>
    </section>
    <div class="fine">RASA × 文義復興</div>
  </main><div class="toast" id="toast"></div>
<script>
(function(){
  const cfg=window.RASA_CONFIG||{};
  const frequency=Math.max(1,Math.min(15,parseInt(new URLSearchParams(location.search).get('f')||'1',10)||1));
  const $=id=>document.getElementById(id);
  const toast=t=>{ $('toast').textContent=t; $('toast').style.display='block'; setTimeout(()=>$('toast').style.display='none',3200); };
  $('freqText').textContent='Frequency '+String(frequency).padStart(2,'0');
  $('promptText').textContent=cfg.DEFAULT_PROMPT||'今晚，你想留下什麼？';
  const supabaseClient=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  $('enterBtn').onclick=()=>{ $('intro').classList.remove('active'); $('formScreen').classList.add('active'); };
  $('sendBtn').onclick=async()=>{
    const btn=$('sendBtn');
    const msg=$('message').value.trim();
    const nick=$('nickname').value.trim()||'Anonymous';
    if(!msg){ toast('請留下一句話'); return; }
    try{
      btn.disabled=true; btn.textContent='SENDING'; $('status').textContent='正在送往共鳴牆…';
      const {error}=await supabaseClient.from('posts').insert({frequency,nickname:nick,message:msg});
      if(error) throw error;
      $('formScreen').classList.remove('active'); $('done').classList.add('active');
    }catch(err){
      console.error(err); $('status').textContent='送出失敗：'+(err.message||'請確認 Supabase 權限'); btn.disabled=false; btn.textContent='SEND';
    }
  };
})();
</script>
</body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RASA Living Wall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;width:100vw;height:100vh;background:#030303;color:#eee;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif} body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 18% 20%,rgba(255,255,255,.08),transparent 28%),radial-gradient(circle at 84% 74%,rgba(255,255,255,.055),transparent 34%),linear-gradient(180deg,#080808,#010101);filter:blur(22px);animation:bg 12s ease-in-out infinite alternate}@keyframes bg{to{transform:scale(1.05);opacity:.8}}
.brand{position:fixed;left:42px;top:34px;display:flex;gap:24px;align-items:center;z-index:3;opacity:.78}.brand img{filter:invert(1) brightness(1.22);opacity:.82}.brand .rasa{width:160px}.brand .wenyi{width:210px}.brand:before{content:"";position:absolute;inset:-28px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);filter:blur(18px);z-index:-1}.meta{position:fixed;right:42px;top:38px;color:#777;letter-spacing:.18em;font-size:12px;text-transform:uppercase;z-index:3}.field{position:fixed;inset:0}.item{position:absolute;max-width:min(560px,46vw);min-width:220px;opacity:0;filter:blur(10px);animation:float var(--dur,28s) ease-in-out forwards;will-change:transform,opacity,filter}.bubble{padding:24px 28px;border:1px solid rgba(255,255,255,.11);background:rgba(12,12,12,.56);border-radius:30px;box-shadow:0 20px 80px rgba(0,0,0,.45),0 0 60px rgba(255,255,255,.045);backdrop-filter:blur(15px)}.freq{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#888;margin-bottom:12px}.msg{font-size:clamp(24px,3.2vw,48px);line-height:1.48;letter-spacing:.05em;font-weight:300;white-space:pre-wrap}.nick{margin-top:14px;font-size:12px;color:#777;letter-spacing:.12em}.empty{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;color:#555;letter-spacing:.2em;line-height:2;z-index:2}.pulse{width:10px;height:10px;border-radius:50%;background:#777;margin:0 auto 22px;box-shadow:0 0 30px rgba(255,255,255,.28);animation:pulse 1.8s infinite ease-in-out}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
@keyframes float{0%{opacity:0;filter:blur(12px);transform:translate3d(0,50px,0) scale(.94) rotate(var(--rot))}12%{opacity:.94;filter:blur(0);transform:translate3d(var(--dx1),var(--dy1),0) scale(1) rotate(var(--rot))}78%{opacity:.94;filter:blur(0)}100%{opacity:0;filter:blur(12px);transform:translate3d(var(--dx2),var(--dy2),0) scale(1.04) rotate(var(--rot))}}
.footer{position:fixed;left:42px;bottom:34px;color:#555;letter-spacing:.18em;font-size:11px;text-transform:uppercase;z-index:3}.count{position:fixed;right:42px;bottom:34px;color:#555;letter-spacing:.18em;font-size:11px;z-index:3}
</style></head>
<body><div class="brand"><img class="rasa" src="./assets/rasa-logo.png"><img class="wenyi" src="./assets/wenyi-logo.png"></div><div class="meta">Living Wall</div><div class="field" id="field"></div><div class="empty" id="empty"><div class="pulse"></div>等待新的共鳴<br>WAITING FOR RESONANCE</div><div class="footer">RASA × 文義復興</div><div class="count" id="count">0 signals</div>
<script>
(function(){
 const cfg=window.RASA_CONFIG||{}; const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY); const field=document.getElementById('field'); const empty=document.getElementById('empty'); const count=document.getElementById('count'); let total=0; const params=new URLSearchParams(location.search); const only=params.get('f'); const placed=[];
 function rand(min,max){return Math.random()*(max-min)+min} function esc(s){return (s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
 function pickSpot(){for(let i=0;i<24;i++){const x=rand(6,66), y=rand(16,70); if(!placed.some(p=>Math.abs(p.x-x)<18 && Math.abs(p.y-y)<20)){placed.push({x,y,t:Date.now()}); return {x,y};}} return {x:rand(6,66),y:rand(16,70)}}
 function add(post){ if(only && Number(only)!==Number(post.frequency))return; if(!post.message)return; empty.style.display='none'; total++; count.textContent=total+' signals'; placed.splice(0,Math.max(0,placed.length-18)); const spot=pickSpot(); const el=document.createElement('div'); el.className='item'; const dur=rand(28,42); el.style.left=spot.x+'vw'; el.style.top=spot.y+'vh'; el.style.setProperty('--dur',dur+'s'); el.style.setProperty('--rot',rand(-2.2,2.2)+'deg'); el.style.setProperty('--dx1',rand(-18,18)+'px'); el.style.setProperty('--dy1',rand(-24,10)+'px'); el.style.setProperty('--dx2',rand(-70,70)+'px'); el.style.setProperty('--dy2',rand(-140,-60)+'px');
 const html=`<div class="bubble"><div class="freq">Frequency ${String(post.frequency||1).padStart(2,'0')}</div><div class="msg">${esc(post.message)}</div><div class="nick">${esc(post.nickname||'Anonymous')}</div></div>`; el.innerHTML=html; field.appendChild(el); setTimeout(()=>el.remove(),dur*1000+800); }
 async function load(){ const {data,error}=await client.from('posts').select('*').order('created_at',{ascending:false}).limit(24); if(error){console.error(error); return} (data||[]).reverse().forEach((p,i)=>setTimeout(()=>add(p),i*850)); }
 load();
 function subscribe(){ client.channel('rasa-posts-text').on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},payload=>add(payload.new)).subscribe(status=>{ if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){setTimeout(subscribe,2500)} }); }
 subscribe(); setInterval(load,60000);
 document.addEventListener('click',()=>{ if(document.fullscreenEnabled&&!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); },{once:true});
})();
</script></body></html>
